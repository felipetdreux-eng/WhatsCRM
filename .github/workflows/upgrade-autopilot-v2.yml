name: Upgrade Autopilot 2.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upgrade-autopilot-v2.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply Autopilot 2.0 patch
        run: python scripts/upgrade_autopilot_v2.py
      - name: Install dependencies
        run: npm ci
      - name: Run checks
        run: npm run check
      - name: Commit feature
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Autopilot.jsx src/autopilotEngine.js src/autopilot-v2.css tests/autopilot.test.js
          git commit -m "Upgrade Autopilot to 2.0"
          git push origin main
