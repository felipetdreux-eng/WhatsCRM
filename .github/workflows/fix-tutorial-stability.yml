name: Fix tutorial stability

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-tutorial-stability.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply patch
        run: python scripts/fix_tutorial_stability.py
      - name: Install dependencies
        run: npm ci
      - name: Run checks
        run: npm run check
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Tutorial.jsx src/tutorial.css
          git commit -m "Stabilize tutorial card and spotlight"
          git push origin main
