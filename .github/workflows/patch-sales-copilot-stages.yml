name: Patch sales copilot stages

on:
  push:
    paths:
      - 'scripts/patch_sales_copilot_stages.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply sales copilot stage procedure
        run: python scripts/patch_sales_copilot_stages.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/sales-assistant/index.ts
          git diff --cached --quiet && exit 0
          git commit -m "Teach sales copilot staged outreach procedure"
          git push
