name: Add human contact message

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-human-contact-message.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Add message template
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/Messages.jsx')
          text = p.read_text()
          anchor = "  {\n    id: 'follow-up',\n    title: 'Follow-up',"
          insert = "  {\n    id: 'human-contact',\n    title: 'Falar com responsável',\n    category: 'Triagem',\n    text: 'Oi! Preciso falar com um atendente humano ou com a pessoa responsável pelo comercial/marketing da {empresa}. Você pode me encaminhar, por favor? É sobre uma proposta de parceria.',\n  },\n"
          if "id: 'human-contact'" in text:
              raise SystemExit('Template already exists')
          if anchor not in text:
              raise SystemExit('Template anchor not found')
          text = text.replace(anchor, insert + anchor, 1)
          p.write_text(text)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Run checks
        run: npm run check
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Messages.jsx
          git commit -m "Add human contact message template"
          git push origin main
