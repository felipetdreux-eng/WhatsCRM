name: Fix message dark controls

on:
  push:
    paths:
      - '.github/workflows/fix-message-dark-controls.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - name: Patch dark message controls
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/dark.css')
          text = path.read_text()
          marker = '/* Messages contact finder dark fix */'
          if marker not in text:
              text += '''\n\n/* Messages contact finder dark fix */\nhtml[data-theme="dark"] .messages-lead-finder{background:#15181e;border-color:#2a3039;box-shadow:none}\nhtml[data-theme="dark"] .messages-contact-search,\nhtml[data-theme="dark"] .messages-status-filter,\nhtml[data-theme="dark"] .messages-lead-picker select{background:#101319;border-color:#343c48;color:#dfe4ea}\nhtml[data-theme="dark"] .messages-contact-search{color:#8893a1}\nhtml[data-theme="dark"] .messages-contact-search input{background:transparent;border:0;color:#f0f3f6}\nhtml[data-theme="dark"] .messages-contact-search input::placeholder{color:#737d8b}\nhtml[data-theme="dark"] .messages-control-label{color:#b7bec7}\nhtml[data-theme="dark"] .messages-lead-count{color:#87919e}\nhtml[data-theme="dark"] .messages-contact-search:focus-within,\nhtml[data-theme="dark"] .messages-status-filter:focus,\nhtml[data-theme="dark"] .messages-lead-picker select:focus{border-color:#3d8f6b;box-shadow:0 0 0 3px rgba(44,196,126,.10)}\n'''
              path.write_text(text)
          PY
      - run: npm ci
      - run: npm run check
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/dark.css
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Fix message contact finder in dark mode"
          git push
