name: Move edit button into info card

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/move-edit-button.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch UI
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/App.jsx')
          text = p.read_text()
          old_top = '''          <div className="detail-top-actions">\n            {!editingLead && <button type="button" className="secondary-button" onClick={startEditing}><Pencil size={16} /> Editar</button>}\n            <button type="button" className="primary-button" onClick={() => openWhatsApp(selectedLead)}><MessageCircle size={17} /> Abrir WhatsApp</button>\n          </div>'''
          new_top = '''          <div className="detail-top-actions">\n            <button type="button" className="primary-button" onClick={() => openWhatsApp(selectedLead)}><MessageCircle size={17} /> Abrir WhatsApp</button>\n          </div>'''
          if old_top not in text:
              raise SystemExit('Top edit button block not found')
          text = text.replace(old_top, new_top, 1)

          old_info = '''              <section className="detail-card">\n                <div className="section-heading"><div><h2>Informações</h2><p>Dados principais deste lead.</p></div></div>'''
          new_info = '''              <section className="detail-card">\n                <div className="section-heading">\n                  <div><h2>Informações</h2><p>Dados principais deste lead.</p></div>\n                  <button type="button" className="secondary-button" onClick={startEditing}><Pencil size={16} /> Editar</button>\n                </div>'''
          if old_info not in text:
              raise SystemExit('Info heading block not found')
          text = text.replace(old_info, new_info, 1)
          p.write_text(text)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Run checks
        run: npm run check
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git commit -m "Move lead edit button into info card"
          git push origin main
