name: Switch sales copilot slug

on:
  push:
    paths:
      - 'scripts/switch_sales_copilot_slug.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Switch frontend to sales-copilot function
        run: python scripts/switch_sales_copilot_slug.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/LeadReplyAssistant.jsx
          git diff --cached --quiet && exit 0
          git commit -m "Use staged sales copilot backend"
          git push
