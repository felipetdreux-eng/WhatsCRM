name: Fuply audit fixes

on:
  push:
    paths:
      - '.github/workflows/fuply-audit-fixes.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - name: Apply audited fixes
        run: python3 .github/scripts/fuply_audit_fixes.py
      - run: npm ci
      - run: npm run check
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/backendBridge.js src/App.jsx src/LeadImporter.jsx src/AuthFlow.jsx src/Tutorial.jsx src/jacobDemoData.js
          git commit -m "Fix audited Fuply data and demo bugs"
          git push
