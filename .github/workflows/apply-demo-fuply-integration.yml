name: Apply demo Fuply integration

on:
  push:
    branches: [main]
    paths:
      - 'scripts/integrate_demo_site.py'

permissions:
  contents: write

jobs:
  patch-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Integrate demo form with Fuply
        run: python scripts/integrate_demo_site.py
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/demo/index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Connect demo website leads directly to Fuply"
            git push
          fi
