name: Patch copilot safe mode

on:
  push:
    paths:
      - 'scripts/patch_copilot_safe_mode.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch Copilot safe mode
        run: python scripts/patch_copilot_safe_mode.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/LeadReplyAssistant.jsx
          git diff --cached --quiet && exit 0
          git commit -m "Allow staged safe mode in sales copilot"
          git push
