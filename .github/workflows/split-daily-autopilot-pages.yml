name: Split Central do Dia and Autopilot pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/split-daily-autopilot-pages.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch navigation and dashboard
        run: python scripts/split_daily_autopilot.py

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Commit pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/Dashboard.jsx
          git commit -m "Expose Central do Dia and Autopilot 2.0 pages"
          git push origin main
