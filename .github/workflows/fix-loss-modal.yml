name: Fix loss modal syntax

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-loss-modal.yml'
      - 'scripts/fix_loss_modal.py'

permissions:
  contents: write

jobs:
  fix-loss-modal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fix loss modal nesting
        run: python scripts/fix_loss_modal.py
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Fix lost lead modal nesting"
            git push
          fi
