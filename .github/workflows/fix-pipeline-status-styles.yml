name: Fix Fuply pipeline status styles

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-pipeline-status-styles.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch status badges
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/leads.css')
          text = p.read_text()
          old = '.leads-status.status-proposta-enviada{background:#fff0e3;color:#ce6411}.leads-status.status-vendido{background:#e5f7ed;color:#14794f}'
          new = '.leads-status.status-proposta-enviada{background:#fff0e3;color:#ce6411}.leads-status.status-negociação{background:#efedff;color:#6250c8}.leads-status.status-fechado{background:#e5f7ed;color:#14794f}'
          if old not in text:
              raise SystemExit('status style block not found')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Install dependencies
        run: npm ci
      - name: Run checks
        run: npm run check
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/leads.css
          git commit -m "Fix Fuply pipeline status styles"
          git push origin main
