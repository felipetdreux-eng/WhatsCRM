name: Fix AI lead selection

on:
  push:
    paths:
      - 'scripts/fix_ai_lead_selection.py'

permissions:
  contents: write

jobs:
  fix-ai-selection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fix AI lead selection
        run: python scripts/fix_ai_lead_selection.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/CentralDoDia.jsx src/GlobalQuickActions.jsx
          git diff --cached --quiet && exit 0
          git commit -m "Require explicit lead selection for AI assistant"
          git push
