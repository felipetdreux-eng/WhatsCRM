name: Apply Fuply pipeline statuses

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-pipeline-statuses.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - name: Apply pipeline patch
        run: node scripts/patch-pipeline-statuses.mjs
      - name: Install dependencies
        run: npm ci
      - name: Run checks
        run: npm run check
      - name: Commit change
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git commit -m "Update Fuply pipeline statuses"
          git push origin main
