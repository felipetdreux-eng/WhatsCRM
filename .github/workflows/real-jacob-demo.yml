name: Real Jacob demo

on:
  push:
    paths:
      - '.github/workflows/real-jacob-demo.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - name: Patch real app demo mode
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Pattern not found in {path}: {old[:120]}')
              p.write_text(text.replace(old, new, count))

          # App.jsx: same product, isolated persistence.
          replace('src/App.jsx',
              'export default function App() {\n  const [account, setAccount] = useState(ACTIVE_ACCOUNT);\n  const [leads, setLeads] = useState(() => {\n    try {\n      const saved = JSON.parse(localStorage.getItem(\'zapflow-leads\'));\n      return migrateLeads(Array.isArray(saved) ? saved : buildDemoLeads());\n    } catch {\n      return migrateLeads(buildDemoLeads());\n    }\n  });\n  const [teamMembers, setTeamMembers] = useState([]);',
              'export default function App({ demoMode = false, demoAccount = null, demoLeads = null, demoTeamMembers = [], demoWhatsAppPhone = \'\' }) {\n  const [account, setAccount] = useState(demoMode && demoAccount ? demoAccount : ACTIVE_ACCOUNT);\n  const [leads, setLeads] = useState(() => {\n    if (demoMode && Array.isArray(demoLeads)) return migrateLeads(demoLeads);\n    try {\n      const saved = JSON.parse(localStorage.getItem(\'zapflow-leads\'));\n      return migrateLeads(Array.isArray(saved) ? saved : buildDemoLeads());\n    } catch {\n      return migrateLeads(buildDemoLeads());\n    }\n  });\n  const [teamMembers, setTeamMembers] = useState(demoMode ? demoTeamMembers : []);')

          replace('src/App.jsx',
              "  useEffect(() => {\n    localStorage.setItem('zapflow-leads', JSON.stringify(leads));\n  }, [leads]);",
              "  useEffect(() => {\n    if (demoMode) return;\n    localStorage.setItem('zapflow-leads', JSON.stringify(leads));\n  }, [leads, demoMode]);")

          replace('src/App.jsx',
              "  useEffect(() => {\n    const handleRemoteLeads = event => {",
              "  useEffect(() => {\n    if (demoMode) return undefined;\n    const handleRemoteLeads = event => {")
          replace('src/App.jsx',
              "  }, []);\n\n  useEffect(() => {\n    let active = true;\n    if (!account?.id) return undefined;\n    loadWorkspaceContext(account.id)",
              "  }, [demoMode]);\n\n  useEffect(() => {\n    let active = true;\n    if (demoMode) { setTeamMembers(demoTeamMembers); return undefined; }\n    if (!account?.id) return undefined;\n    loadWorkspaceContext(account.id)")
          replace('src/App.jsx',
              "  }, [account?.id]);",
              "  }, [account?.id, demoMode]);", 1)

          replace('src/App.jsx',
              "  const logActivity = async (lead, kind, title, detail = '', metadata = {}) => {\n    if (!account?.id || !lead?.id) return;",
              "  const logActivity = async (lead, kind, title, detail = '', metadata = {}) => {\n    if (demoMode) { emitActivityRefresh(lead?.id); return; }\n    if (!account?.id || !lead?.id) return;")

          replace('src/App.jsx',
              "    const phone = whatsappPhone(lead?.phone);",
              "    const phone = whatsappPhone(demoMode && demoWhatsAppPhone ? demoWhatsAppPhone : lead?.phone);")

          replace('src/App.jsx',
              "  const handleLogout = () => {\n    if (!account?.id) return;\n    logoutAccount(account.id);\n    window.location.reload();\n  };",
              "  const handleLogout = () => {\n    if (demoMode) { window.location.reload(); return; }\n    if (!account?.id) return;\n    logoutAccount(account.id);\n    window.location.reload();\n  };")

          replace('src/App.jsx',
              "    if (account?.id) {\n      syncLeads([next], account.id)",
              "    if (account?.id && !demoMode) {\n      syncLeads([next], account.id)")

          replace('src/App.jsx',
              '<LeadHistory userId={account?.id} leadId={selectedLead.id} />',
              '<LeadHistory userId={account?.id} leadId={selectedLead.id} demoMode={demoMode} />')
          replace('src/App.jsx',
              "if (activePage === 'Mensagens') return <Messages leads={leads} openWhatsApp={openWhatsApp} userId={account?.id} />;",
              "if (activePage === 'Mensagens') return <Messages leads={leads} openWhatsApp={openWhatsApp} userId={account?.id} demoMode={demoMode} />;")
          replace('src/App.jsx',
              "if (activePage === 'Configurações') return <SettingsPage account={account} onAccountChange={setAccount} onLogout={handleLogout} />;",
              "if (activePage === 'Configurações') return <SettingsPage account={account} onAccountChange={setAccount} onLogout={handleLogout} demoMode={demoMode} />;")

          # Messages.jsx: same screen and controls, local-only saves in demo.
          replace('src/Messages.jsx',
              'export default function Messages({ leads = [], openWhatsApp, userId }) {',
              'export default function Messages({ leads = [], openWhatsApp, userId, demoMode = false }) {')
          replace('src/Messages.jsx',
              "    const hydrate = async () => {\n      if (!userId) {",
              "    const hydrate = async () => {\n      if (demoMode) {\n        if (active) { setTemplates(DEFAULT_TEMPLATES); setLeadOptions(Array.isArray(leads) ? leads : []); setError(''); setLoading(false); }\n        return;\n      }\n      if (!userId) {")
          replace('src/Messages.jsx',
              '  }, [userId]);',
              '  }, [userId, demoMode]);')
          replace('src/Messages.jsx',
              "    if (!editing?.title?.trim() || !editing?.text?.trim() || !userId) return;",
              "    if (!editing?.title?.trim() || !editing?.text?.trim() || (!userId && !demoMode)) return;")
          replace('src/Messages.jsx',
              "    try {\n      await syncMessages([next], userId);\n      setTemplates(current => current.map(item => item.id === next.id ? next : item));",
              "    try {\n      if (!demoMode) await syncMessages([next], userId);\n      setTemplates(current => current.map(item => item.id === next.id ? next : item));")
          replace('src/Messages.jsx',
              "    if (!userId || saving) return;",
              "    if ((!userId && !demoMode) || saving) return;")
          replace('src/Messages.jsx',
              "    try {\n      await syncMessages(DEFAULT_TEMPLATES, userId);\n      setTemplates(DEFAULT_TEMPLATES);",
              "    try {\n      if (!demoMode) await syncMessages(DEFAULT_TEMPLATES, userId);\n      setTemplates(DEFAULT_TEMPLATES);")
          # Keep demo lead options synced after local pipeline edits.
          anchor = "  const selectedLead = leadOptions.find(lead => lead.id === selectedLeadId) || null;"
          replace('src/Messages.jsx', anchor,
              "  useEffect(() => { if (demoMode) setLeadOptions(Array.isArray(leads) ? leads : []); }, [leads, demoMode]);\n\n" + anchor)

          # LeadHistory.jsx: preserve exact card, no remote reads.
          replace('src/LeadHistory.jsx',
              'export default function LeadHistory({ userId, leadId }) {',
              'export default function LeadHistory({ userId, leadId, demoMode = false }) {')
          replace('src/LeadHistory.jsx',
              "  const refresh = async () => {\n    if (!userId || !leadId) {",
              "  const refresh = async () => {\n    if (demoMode) {\n      const now = new Date().toISOString();\n      setItems([\n        { id: `demo-${leadId}-3`, kind: 'followup_scheduled', title: 'Próximo contato agendado', detail: 'Retorno comercial programado para esta oportunidade.', createdAt: now },\n        { id: `demo-${leadId}-2`, kind: 'whatsapp_opened', title: 'WhatsApp aberto', detail: 'Conversa aberta pelo Fuply.', createdAt: now },\n        { id: `demo-${leadId}-1`, kind: 'lead_created', title: 'Lead criado', detail: 'Oportunidade adicionada ao pipeline da demonstração.', createdAt: now },\n      ]);\n      setError(''); setLoading(false); return;\n    }\n    if (!userId || !leadId) {")
          replace('src/LeadHistory.jsx',
              '  }, [userId, leadId]);',
              '  }, [userId, leadId, demoMode]);')

          # SettingsPage.jsx: same controls, local-only persistence in demo.
          replace('src/SettingsPage.jsx',
              'export default function SettingsPage({ account, onAccountChange, onLogout }) {',
              'export default function SettingsPage({ account, onAccountChange, onLogout, demoMode = false }) {')
          replace('src/SettingsPage.jsx',
              "      await updateProfileName(account?.id, cleanName);",
              "      if (!demoMode) await updateProfileName(account?.id, cleanName);")
          replace('src/SettingsPage.jsx',
              "      await updateProfileTheme(account?.id, nextTheme);",
              "      if (!demoMode) await updateProfileTheme(account?.id, nextTheme);")
          replace('src/SettingsPage.jsx',
              '<TeamPanel account={account} />',
              '<TeamPanel account={account} demoMode={demoMode} />')

          # TeamPanel.jsx: exact team UI, local demo workspace actions.
          replace('src/TeamPanel.jsx',
              'export default function TeamPanel({ account }) {',
              'export default function TeamPanel({ account, demoMode = false }) {')
          replace('src/TeamPanel.jsx',
              "  const refresh = async () => {\n    if (!account?.id) return;",
              "  const refresh = async () => {\n    if (demoMode) {\n      const workspace = { id: 'demo-workspace', name: 'Jacob Engenharia' };\n      setContext({ activeWorkspace: workspace, workspaces: [workspace], myRole: 'owner', members: [\n        { user_id: account?.id || 'demo-jacob', name: account?.name || 'Comercial Jacob', role: 'owner' },\n        { user_id: 'demo-eng', name: 'Engenharia', role: 'member' },\n        { user_id: 'demo-dir', name: 'Diretoria', role: 'admin' },\n      ] });\n      setWorkspaceName(workspace.name); setLoading(false); setError(''); return;\n    }\n    if (!account?.id) return;")
          replace('src/TeamPanel.jsx',
              '  useEffect(() => { refresh(); }, [account?.id]);',
              '  useEffect(() => { refresh(); }, [account?.id, demoMode]);')
          replace('src/TeamPanel.jsx',
              "    try {\n      const code = await createWorkspaceInvite(activeWorkspace.id);",
              "    try {\n      const code = demoMode ? 'JACOB2026' : await createWorkspaceInvite(activeWorkspace.id);")
          replace('src/TeamPanel.jsx',
              "    try {\n      await joinWorkspaceByCode(account.id, code);\n      setNotice('Você entrou na equipe. Atualizando o Fuply...');\n      window.setTimeout(() => window.location.reload(), 300);",
              "    try {\n      if (demoMode) { setNotice('Demonstração: código aceito localmente.'); setJoinCode(''); return; }\n      await joinWorkspaceByCode(account.id, code);\n      setNotice('Você entrou na equipe. Atualizando o Fuply...');\n      window.setTimeout(() => window.location.reload(), 300);")
          replace('src/TeamPanel.jsx',
              "    try {\n      const updated = await renameWorkspace(activeWorkspace.id, cleanName);",
              "    try {\n      const updated = demoMode ? { ...activeWorkspace, name: cleanName } : await renameWorkspace(activeWorkspace.id, cleanName);")

          # main.jsx: render the actual App in demo mode. No second UI.
          p = Path('src/main.jsx')
          text = p.read_text()
          text = text.replace("import JacobDemo from './JacobDemo';\n", '')
          if "from './jacobDemoData';" not in text:
              text = text.replace("import GlobalImportDrop from './GlobalImportDrop';\n", "import GlobalImportDrop from './GlobalImportDrop';\nimport { JACOB_DEMO_ACCOUNT, JACOB_DEMO_LEADS, JACOB_DEMO_TEAM, JACOB_DEMO_WHATSAPP } from './jacobDemoData';\n")
          text = text.replace("document.documentElement.dataset.theme = isJacobDemo ? 'light' : (activeAccount?.theme === 'dark' ? 'dark' : 'light');", "document.documentElement.dataset.theme = isJacobDemo ? JACOB_DEMO_ACCOUNT.theme : (activeAccount?.theme === 'dark' ? 'dark' : 'light');")
          old = """if (rootHost && isJacobDemo) {\n  createRoot(rootHost).render(\n    <React.StrictMode>\n      <JacobDemo />\n    </React.StrictMode>,\n  );\n} else if (rootHost && activeAccount?.onboardingCompleted) {"""
          new = """if (rootHost && isJacobDemo) {\n  createRoot(rootHost).render(\n    <React.StrictMode>\n      <App demoMode demoAccount={JACOB_DEMO_ACCOUNT} demoLeads={JACOB_DEMO_LEADS} demoTeamMembers={JACOB_DEMO_TEAM} demoWhatsAppPhone={JACOB_DEMO_WHATSAPP} />\n    </React.StrictMode>,\n  );\n} else if (rootHost && activeAccount?.onboardingCompleted) {"""
          if old not in text:
              raise SystemExit('Main demo render pattern not found')
          p.write_text(text.replace(old, new))
          PY
      - run: npm ci
      - run: npm run check
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/main.jsx src/Messages.jsx src/LeadHistory.jsx src/SettingsPage.jsx src/TeamPanel.jsx
          git commit -m "Run Jacob demo through the real Fuply app"
          git push
