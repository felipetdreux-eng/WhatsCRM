name: Inline lead info editor

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inline-lead-info-edit.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply patch
        run: python scripts/inline_lead_info_patch.py
      - name: Install dependencies
        run: npm ci
      - name: Run checks
        run: npm run check
      - name: Commit inline editor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/detail.css
          git commit -m "Edit lead information inline"
          git push origin main
