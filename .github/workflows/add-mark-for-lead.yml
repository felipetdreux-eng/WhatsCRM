name: Add lead mark-for control

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-mark-for-lead.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply patch
        run: python scripts/add_mark_for_lead.py
      - name: Install dependencies
        run: npm ci
      - name: Run checks
        run: npm run check
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/LeadsPage.jsx src/leads-integrated.css
          git commit -m "Add mark-for control to Leads"
          git push origin main
