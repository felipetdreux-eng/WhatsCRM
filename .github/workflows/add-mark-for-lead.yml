name: Add lead mark-for control

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-mark-for-lead.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch Leads mark-for control
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/LeadsPage.jsx')
          text = p.read_text()

          # Undo the extra Tomorrow FILTER added from the previous misunderstanding.
          text = text.replace(
            "const SCOPES = ['Todos', 'Hoje', 'Amanhã', 'Atrasados', 'Próx. 7 dias', 'Sem próximo contato', 'Esfriando'];",
            "const SCOPES = ['Todos', 'Hoje', 'Atrasados', 'Próx. 7 dias', 'Sem próximo contato', 'Esfriando'];",
            1,
          )
          text = text.replace("  if (scope === 'Amanhã') return days === 1;\n", "", 1)
          text = text.replace("      tomorrow: dated.filter(lead => diff(lead.nextContact) === 1),\n", "", 1)
          tomorrow_card = "        <button type=\"button\" className={`tomorrow ${scope === 'Amanhã' ? 'active' : ''}`} onClick={() => setScope(scope === 'Amanhã' ? 'Todos' : 'Amanhã')}><Clock3 size={18} /><span>Amanhã<strong>{summary.tomorrow.length}</strong></span></button>\n"
          text = text.replace(tomorrow_card, "", 1)

          # Add helpers to mark a lead for a future contact date directly from the list.
          anchor = "  const openReschedule = lead => {\n    setRescheduling(lead);\n    setSchedule({ date: lead.nextContact || today(), time: lead.nextContactTime || '', action: lead.nextAction || 'Retornar contato' });\n  };\n\n"
          insert = """  const markFor = (lead, days) => {
    if (!lead || CLOSED.includes(lead.status)) return;
    const date = new Date();
    date.setHours(12, 0, 0, 0);
    date.setDate(date.getDate() + days);
    const nextContact = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
    const action = lead.nextAction || 'Retornar contato';
    const now = new Date().toISOString();
    setLeads(current => current.map(item => item.id === lead.id ? {
      ...item,
      nextContact,
      nextAction: action,
      updatedAt: now,
    } : item));
    onActivity?.(
      lead,
      'followup_scheduled',
      lead.nextContact ? 'Follow-up reagendado' : 'Follow-up marcado',
      `${full(nextContact)} · ${action}`,
      { date: nextContact, time: lead.nextContactTime || '', action },
    );
    flash(`${lead.name} marcado para ${pretty(nextContact).toLowerCase()}.`);
  };

  const handleMarkFor = (event, lead) => {
    const value = event.target.value;
    event.target.value = '';
    if (!value) return;
    if (value === 'custom') {
      openReschedule(lead);
      return;
    }
    markFor(lead, Number(value));
  };

"""
          if 'const markFor = (lead, days)' not in text:
            if anchor not in text:
              raise SystemExit('openReschedule anchor not found')
            text = text.replace(anchor, anchor + insert, 1)

          # Add explicit Mark for selector to desktop row actions.
          desktop_anchor = "                  <button type=\"button\" className=\"leads-whatsapp\" onClick={() => openWhatsApp(lead)} title=\"Abrir WhatsApp\" aria-label={`Abrir WhatsApp de ${lead.name}`}><MessageCircle size={15} /></button>\n                  {!CLOSED.includes(lead.status) && <button type=\"button\" className=\"lead-mini-action\" onClick={() => openReschedule(lead)} title=\"Reagendar\" aria-label={`Reagendar ${lead.name}`}><RefreshCw size={15} /></button>}"
          desktop_new = "                  <button type=\"button\" className=\"leads-whatsapp\" onClick={() => openWhatsApp(lead)} title=\"Abrir WhatsApp\" aria-label={`Abrir WhatsApp de ${lead.name}`}><MessageCircle size={15} /></button>\n                  {!CLOSED.includes(lead.status) && <select className=\"lead-mark-for\" defaultValue=\"\" onChange={event => handleMarkFor(event, lead)} aria-label={`Marcar ${lead.name} para uma data`}>\n                    <option value=\"\" disabled>Marcar para</option>\n                    <option value=\"0\">Hoje</option>\n                    <option value=\"1\">Amanhã</option>\n                    <option value=\"3\">+3 dias</option>\n                    <option value=\"7\">+7 dias</option>\n                    <option value=\"custom\">Escolher data…</option>\n                  </select>}"
          if desktop_anchor not in text:
            raise SystemExit('Desktop action anchor not found')
          text = text.replace(desktop_anchor, desktop_new, 1)

          # Add same explicit control on mobile.
          mobile_anchor = "              <button type=\"button\" className=\"mobile-whatsapp\" onClick={() => openWhatsApp(lead)} aria-label={`Abrir WhatsApp de ${lead.name}`}><MessageCircle size={15} /></button>\n              {!CLOSED.includes(lead.status) && <button type=\"button\" className=\"mobile-open\" onClick={() => openReschedule(lead)} aria-label={`Reagendar ${lead.name}`}><RefreshCw size={15} /></button>}"
          mobile_new = "              <button type=\"button\" className=\"mobile-whatsapp\" onClick={() => openWhatsApp(lead)} aria-label={`Abrir WhatsApp de ${lead.name}`}><MessageCircle size={15} /></button>\n              {!CLOSED.includes(lead.status) && <select className=\"lead-mark-for mobile-mark-for\" defaultValue=\"\" onChange={event => handleMarkFor(event, lead)} aria-label={`Marcar ${lead.name} para uma data`}>\n                <option value=\"\" disabled>Marcar para</option>\n                <option value=\"0\">Hoje</option>\n                <option value=\"1\">Amanhã</option>\n                <option value=\"3\">+3 dias</option>\n                <option value=\"7\">+7 dias</option>\n                <option value=\"custom\">Escolher data…</option>\n              </select>}"
          if mobile_anchor not in text:
            raise SystemExit('Mobile action anchor not found')
          text = text.replace(mobile_anchor, mobile_new, 1)

          # Rename modal copy so it works for both first scheduling and rescheduling.
          text = text.replace('<h2 id="reschedule-title">Reagendar follow-up</h2>', '<h2 id="reschedule-title">Marcar para</h2>', 1)
          text = text.replace('<div className="quick-dates"><span>Atalhos</span><button type="button" onClick={() => quick(1)}>Amanhã</button>', '<div className="quick-dates"><span>Atalhos</span><button type="button" onClick={() => quick(0)}>Hoje</button><button type="button" onClick={() => quick(1)}>Amanhã</button>', 1)
          text = text.replace('<button className="primary-button"><RefreshCw size={16} /> Reagendar</button>', '<button className="primary-button"><CalendarClock size={16} /> Salvar marcação</button>', 1)
          p.write_text(text)

          css = Path('src/leads-integrated.css')
          css_text = css.read_text()
          # Restore original summary grid now that Tomorrow is not a separate filter card.
          css_text = css_text.replace('.leads-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));', '.leads-summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));', 1)
          css_text = css_text.replace('.leads-summary button.today svg{color:#12875a}.leads-summary button.tomorrow svg{color:#0f9f8c}.leads-summary button.upcoming svg{color:#2f80ed}', '.leads-summary button.today svg{color:#12875a}.leads-summary button.upcoming svg{color:#2f80ed}', 1)
          if '.lead-mark-for{' not in css_text:
            css_text += '''\n.lead-mark-for{height:31px;max-width:104px;border:1px solid #d8e6de;border-radius:8px;background:#f7fbf9;color:#12875a;padding:0 7px;font-size:9px;font-weight:700;outline:0;cursor:pointer}.lead-mark-for:hover,.lead-mark-for:focus{border-color:#8bc9aa;background:#edf8f2}.mobile-mark-for{height:34px;max-width:112px}@media(max-width:560px){.lead-directory-card-bottom>div{flex-wrap:wrap;justify-content:flex-end}.mobile-mark-for{max-width:118px}}\n'''
          css.write_text(css_text)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Run checks
        run: npm run check
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/LeadsPage.jsx src/leads-integrated.css
          git commit -m "Add mark-for control to Leads"
          git push origin main
