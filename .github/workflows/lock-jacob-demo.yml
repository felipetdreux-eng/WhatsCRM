name: Lock Jacob demo access

on:
  push:
    paths:
      - '.github/workflows/lock-jacob-demo.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - name: Add token, expiration and safe demo actions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Pattern not found in {path}: {old[:160]}')
              p.write_text(text.replace(old, new, count))

          # Demo credentials. This is a commercial trial gate, not authentication.
          p = Path('src/jacobDemoData.js')
          text = p.read_text()
          access = """\nexport const JACOB_DEMO_ACCESS = {\n  token: 'DR06Fe9IRsebUfJk892O1ihX',\n  expiresAt: '2026-09-14T21:23:44.305612-03:00',\n};\n"""
          if 'JACOB_DEMO_ACCESS' not in text:
              p.write_text(text.rstrip() + '\n' + access)

          # main.jsx: require the exclusive token and enforce absolute expiry.
          p = Path('src/main.jsx')
          text = p.read_text()
          text = text.replace(
            "import { JACOB_DEMO_ACCOUNT, JACOB_DEMO_LEADS, JACOB_DEMO_TEAM, JACOB_DEMO_WHATSAPP } from './jacobDemoData';",
            "import { JACOB_DEMO_ACCESS, JACOB_DEMO_ACCOUNT, JACOB_DEMO_LEADS, JACOB_DEMO_TEAM, JACOB_DEMO_WHATSAPP } from './jacobDemoData';"
          )
          old = """const demo = new URLSearchParams(window.location.search).get('demo');\nconst isJacobDemo = demo === 'jacob';\n\ndocument.documentElement.dataset.theme = isJacobDemo ? JACOB_DEMO_ACCOUNT.theme : (activeAccount?.theme === 'dark' ? 'dark' : 'light');\n\nif (rootHost && isJacobDemo) {\n  createRoot(rootHost).render(\n    <React.StrictMode>\n      <App demoMode demoAccount={JACOB_DEMO_ACCOUNT} demoLeads={JACOB_DEMO_LEADS} demoTeamMembers={JACOB_DEMO_TEAM} demoWhatsAppPhone={JACOB_DEMO_WHATSAPP} />\n    </React.StrictMode>,\n  );\n} else if (rootHost && activeAccount?.onboardingCompleted) {"""
          new = """const params = new URLSearchParams(window.location.search);\nconst demo = params.get('demo');\nconst demoToken = params.get('token');\nconst isJacobDemo = demo === 'jacob';\nconst hasJacobToken = demoToken === JACOB_DEMO_ACCESS.token;\nconst jacobDemoExpired = Date.now() >= new Date(JACOB_DEMO_ACCESS.expiresAt).getTime();\nconst jacobDemoAllowed = isJacobDemo && hasJacobToken && !jacobDemoExpired;\n\ndocument.documentElement.dataset.theme = isJacobDemo ? JACOB_DEMO_ACCOUNT.theme : (activeAccount?.theme === 'dark' ? 'dark' : 'light');\n\nfunction DemoUnavailable({ expired }) {\n  return (\n    <main style={{ minHeight: '100vh', display: 'grid', placeItems: 'center', padding: 24, background: '#f5f7f6', color: '#17211c', fontFamily: 'Inter, system-ui, sans-serif' }}>\n      <section style={{ width: 'min(520px, 100%)', background: '#fff', border: '1px solid #e1e7e3', borderRadius: 18, padding: 30, boxShadow: '0 12px 40px rgba(20,37,28,.08)' }}>\n        <div style={{ width: 42, height: 42, borderRadius: 12, display: 'grid', placeItems: 'center', background: '#eaf7f0', color: '#16885a', fontWeight: 900, marginBottom: 18 }}>F</div>\n        <h1 style={{ margin: 0, fontSize: 28, letterSpacing: '-.04em' }}>{expired ? 'Demonstração encerrada' : 'Link de demonstração inválido'}</h1>\n        <p style={{ margin: '10px 0 0', color: '#66756d', lineHeight: 1.6 }}>{expired ? 'O período de teste deste acesso terminou. Para continuar usando o Fuply, é necessário ativar uma conta.' : 'Este acesso não possui um token válido. Solicite um novo link de demonstração.'}</p>\n      </section>\n    </main>\n  );\n}\n\nif (rootHost && isJacobDemo && !jacobDemoAllowed) {\n  createRoot(rootHost).render(<DemoUnavailable expired={jacobDemoExpired} />);\n} else if (rootHost && jacobDemoAllowed) {\n  createRoot(rootHost).render(\n    <React.StrictMode>\n      <App demoMode demoAccount={JACOB_DEMO_ACCOUNT} demoLeads={JACOB_DEMO_LEADS} demoTeamMembers={JACOB_DEMO_TEAM} demoWhatsAppPhone={JACOB_DEMO_WHATSAPP} />\n    </React.StrictMode>,\n  );\n} else if (rootHost && activeAccount?.onboardingCompleted) {"""
          if old not in text:
              raise SystemExit('main.jsx access pattern not found')
          p.write_text(text.replace(old, new))

          # App.jsx: block real WhatsApp in demo while preserving local interaction/follow-up flow.
          replace('src/App.jsx',
              "  const [replyAssistantSignal, setReplyAssistantSignal] = useState(0);",
              "  const [replyAssistantSignal, setReplyAssistantSignal] = useState(0);\n  const [demoNotice, setDemoNotice] = useState('');")

          old = """  const openWhatsApp = (lead, message = '', options = {}) => {\n    const phone = whatsappPhone(demoMode && demoWhatsAppPhone ? demoWhatsAppPhone : lead?.phone);\n    if (!phone) return false;\n    const currentLead = leads.find(item => item.id === lead.id) || lead;\n    const params = new URLSearchParams({ phone });\n    if (message) params.set('text', message);\n    window.open(`https://web.whatsapp.com/send?${params.toString()}`, '_blank', 'noopener,noreferrer');\n\n    const now = new Date().toISOString();"""
          new = """  const openWhatsApp = (lead, message = '', options = {}) => {\n    const currentLead = leads.find(item => item.id === lead.id) || lead;\n    if (!currentLead) return false;\n    const phone = whatsappPhone(demoMode && demoWhatsAppPhone ? demoWhatsAppPhone : lead?.phone);\n    if (!phone) return false;\n\n    if (demoMode) {\n      setDemoNotice('Modo demonstração: o WhatsApp real está bloqueado. A ação foi simulada dentro do Fuply.');\n      window.setTimeout(() => setDemoNotice(''), 4500);\n    } else {\n      const params = new URLSearchParams({ phone });\n      if (message) params.set('text', message);\n      window.open(`https://web.whatsapp.com/send?${params.toString()}`, '_blank', 'noopener,noreferrer');\n    }\n\n    const now = new Date().toISOString();"""
          replace('src/App.jsx', old, new)

          replace('src/App.jsx',
              "      {undoAction && <div className=\"undo-toast\" role=\"status\"><span>{undoAction.message}</span><button type=\"button\" onClick={restoreUndo}>Desfazer</button></div>}",
              "      {undoAction && <div className=\"undo-toast\" role=\"status\"><span>{undoAction.message}</span><button type=\"button\" onClick={restoreUndo}>Desfazer</button></div>}\n      {demoNotice && <div className=\"undo-toast\" role=\"status\"><span>{demoNotice}</span></div>}")
          PY
      - run: npm ci
      - run: npm run check
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.jsx src/App.jsx src/jacobDemoData.js
          git commit -m "Lock Jacob demo to a 48-hour token"
          git push
