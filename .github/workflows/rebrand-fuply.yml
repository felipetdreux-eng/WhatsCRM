name: Rebrand to Fuply

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebrand-fuply.yml'

permissions:
  contents: write

jobs:
  rebrand:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply rebrand
        run: python scripts/rename_fuply_brand.py
      - name: Install dependencies
        run: npm ci
      - name: Run checks
        run: npm run check
      - name: Commit rebrand
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md index.html package.json package-lock.json src
          git commit -m "Rebrand product to Fuply"
          git push origin main
